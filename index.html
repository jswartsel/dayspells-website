<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dayspells</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Palette measured off the panels. */
  :root{
    --linen:      #d8c98a;
    --iris:       #3f1b32;
    --iris-deep:  #2e0921;
    --flare:      #f4451f;   /* the original mark colour; starting point */
    --mark-color: #f4451f;   /* wordmark only -- driven by the panel */
    --mark-scale: 1;
    /* One type scale for the whole site. The wordmark is 1x; everything
       else is a fraction of it, so markSize still moves all of it at
       once and the grass zones (measured off the boxes) follow. */
    --type: calc(clamp(1.5rem,7.2vw,4.2rem) * var(--mark-scale));
    --track: clamp(.12em,.9vw,.24em);
    --frond-dark: #1a130b;
    --cream:      #f3dfb9;
  }
  *{box-sizing:border-box}
  /* Author styles beat the UA sheet, so the display rules below would
     otherwise un-hide the views and the back link. Views are switched by
     [hidden] and nothing else, so this has to be the last word. */
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden;
    background:var(--linen);
    font-family:"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color:var(--iris);
    -webkit-font-smoothing:antialiased;
  }
  #field{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none}

  .stage{position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; z-index:2}
  /* Only one view is in the DOM flow at a time -- the rest are [hidden],
     so they measure 0x0 and drop out of the grid and out of the zone
     pass alike. The margin-bottom rides the block up off dead centre:
     a centred grid item shifts by half its bottom margin, and type
     sitting a little above the middle reads better than type on it. */
  .mark{
    position:relative; text-align:center;
    padding:clamp(1rem,4vw,2.2rem) clamp(1.4rem,6vw,3.6rem);
    margin-bottom:clamp(1.5rem,9vh,5rem);
  }
  .mark::before{
    content:""; position:absolute; inset:-22%;
    background:radial-gradient(ellipse at center,
      rgba(243,223,185,.22) 0%, rgba(243,223,185,.11) 48%,
      rgba(243,223,185,.02) 72%, rgba(243,223,185,0) 86%);
    z-index:-1;
  }
  .mark h1{
    margin:0; font-weight:700; line-height:1; text-transform:lowercase;
    font-size:var(--type);
    letter-spacing:var(--track);
    text-indent:var(--track);
    color:var(--mark-color);
  }
  .mark .caret{color:var(--iris-deep); opacity:.5; animation:blink 1.35s steps(1,end) infinite}
  @keyframes blink{0%,55%{opacity:.5}56%,100%{opacity:0}}

  /* ---------- navigation ---------------------------------------- */
  /* Everything that is type shares the wordmark's face, weight, colour
     and tracking, and differs only in scale. text-indent cancels the
     trailing letter-space so a centred line is optically centred. */
  .stage a, .back{
    pointer-events:auto; display:block; flex:0 0 auto; white-space:nowrap;
    color:var(--mark-color); text-decoration:none;
    font-weight:700; line-height:1; text-transform:lowercase;
    letter-spacing:var(--track); text-indent:var(--track);
  }
  .stage a:hover, .back:hover{text-decoration:underline}

  /* ---------- stacking, and the gaps that let flowers through ----- */
  /* Two clearings stop touching when their centres are further apart
     than the sum of the pads facing each other: for two blocks that is
     one line-height plus (ZONE_PAD_Y + ZONE_PAD_Y*ZONE_TOP) = 1.04em.
     Past that there is uncleared field between them, and that band is
     where the flowers come through.

     So each gap below is `type-proportional term + 48px`. The constant
     is the point: a sprite is a fixed number of pixels tall whatever the
     viewport -- a bloom draws 45-65px on a phone exactly as on a laptop
     -- so a gap expressed purely in em leaves 13px of roof on a phone
     and nothing can grow in it. The proportional term cancels the type's
     own pads; the 48px is the roof itself, and it is the same roof
     everywhere. All of it is written against --type rather than em,
     because gap and margin resolve em against their own box (16px), not
     against the child type they are separating.

     The vh ceilings are the one place the roof gives way. Three links
     each with 48px of roof do not fit in a 390px-tall landscape phone --
     "spotify" was clipped off the bottom -- and a clipped link is
     strictly worse than a narrower band. On anything with room, the
     absolute term wins and the ceiling never binds. */
  .nav{
    margin:min(calc(var(--type) * 1.11 + 48px), 26vh) 0 0;
    display:flex; flex-wrap:nowrap; justify-content:center;
    gap:clamp(.8rem,3.4vw,2.4rem);
  }
  /* 4pt under where it started. The vw cap is what holds all four on one
     line in landscape at any width, without wrapping and without
     overflowing -- the ratio alone outgrows the window below ~1150px. */
  .nav a{font-size:min(calc(var(--type) * .54), 4.2vw)}

  /* Portrait: one link per row, with the same flower gap between them. */
  @media (max-aspect-ratio:1/1){
    .nav{
      flex-direction:column; align-items:center;
      gap:calc(var(--type) * .56 + 48px);   /* 1.04 * .54, plus the roof */
    }
    .nav a{font-size:calc(var(--type) * .54)}
  }

  /* The listen stack states the rule directly: gap = 1.04 * type + the
     48px roof. What gives on a short screen is then the TYPE, not the
     roof -- cap the gap instead and the three clearings merge back into
     one column, which is the thing the roof exists to prevent. The
     ceiling is the size at which the stack still fits: three lines plus
     two gaps is 5.08 type-heights plus the two roofs, and 180px covers
     those roofs, the padding and the off-centre nudge. */
  .stack{
    --sfs:min(calc(var(--type) * .72), calc((100vh - 180px) / 5.08));
    list-style:none; margin:0; padding:0;
    display:flex; flex-direction:column; align-items:center;
    gap:calc(var(--sfs) * 1.04 + 48px);
  }
  .stack a{font-size:var(--sfs)}                /* slightly under the wordmark */

  /* 20ch is a hair over one line of "stay tuned for upcoming dates" cut
     in half, so it breaks into two even lines instead of running to the
     window edges. */
  .say{
    margin:0; font-weight:700; line-height:1.32; text-transform:lowercase;
    font-size:calc(var(--type) * .55);
    letter-spacing:var(--track); text-indent:var(--track);
    color:var(--mark-color); max-width:20ch;
  }

  .back{
    position:fixed; z-index:9;
    top:clamp(.1rem,1.2vh,.9rem); left:clamp(.5rem,2.2vw,1.5rem);
    font-size:var(--type); text-indent:0;
  }

  .hint{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:clamp(1.3rem,4vh,2.4rem); z-index:3; margin:0;
    font-size:.64rem; letter-spacing:.22em; color:var(--frond-dark);
    opacity:.55; transition:opacity .9s ease; pointer-events:none;
  }
  .hint[data-done="true"]{opacity:0}

  .loading{
    position:fixed; inset:0; z-index:5; display:grid; place-items:center;
    background:var(--linen); font-size:.68rem; letter-spacing:.24em;
    color:var(--frond-dark); transition:opacity .6s ease;
  }
  .loading[data-done="true"]{opacity:0; pointer-events:none}

  /* ---------- tuning panel -------------------------------------- */
  /* Three plain links in the corner, set in the wordmark's face and
     colour so they read as part of the page rather than as chrome. They
     sit above the panel and stay put while it is open, so 'tweak' is
     always there to close it again. */
  .tools{
    position:fixed; top:11px; right:14px; z-index:9;
    display:flex; gap:14px; align-items:baseline;
  }
  .tools button{
    border:0; background:none; padding:0; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:12px;   /* 15% under 14 */
    text-transform:lowercase; letter-spacing:.14em;
    color:var(--mark-color); opacity:1;
  }
  .tools button:hover{text-decoration:underline}   /* opacity is 1 now */
  .tools button[aria-expanded="true"],
  .tools button[aria-pressed="true"]{opacity:1; text-decoration:underline}
  .tune{
    position:fixed; top:44px; right:8px; z-index:8; width:178px;
    max-height:calc(100vh - 52px); overflow-y:auto;
    padding:8px 10px 10px; border-radius:3px;
    background:rgba(20,15,9,.82); color:var(--cream);
    font-size:9px; letter-spacing:.04em; line-height:1.35;
    backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  }
  .tune[hidden]{display:none}
  .tune::-webkit-scrollbar{width:5px}
  .tune::-webkit-scrollbar-thumb{background:rgba(243,223,185,.2)}
  .tune .grp{margin:7px 0 0; padding-top:5px; border-top:1px solid rgba(243,223,185,.13)}
  .tune .grp:first-child{border-top:0; padding-top:0; margin-top:0}
  .tune .grp i{display:block; font-style:normal; opacity:.42; letter-spacing:.16em; margin-bottom:3px}
  .tune label{display:block; margin:0 0 4px}
  .tune .lab{display:flex; justify-content:space-between; align-items:center; gap:5px; opacity:.8}
  .tune .lab b{font-weight:400; opacity:.95; font-variant-numeric:tabular-nums}
  .tune input[type=range]{
    display:block; width:100%; margin:0; accent-color:var(--mark-color); height:11px;
  }
  .tune input[type=color]{
    width:34px; height:13px; padding:0; border:0; background:none; cursor:pointer;
  }
  .tune input[type=color]::-webkit-color-swatch{border:1px solid rgba(243,223,185,.3); border-radius:2px}
  .tune input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  .tune input[type=checkbox]{width:auto; height:auto; margin:0; accent-color:var(--mark-color)}
  .tune .row{display:flex; gap:4px; margin-top:8px}
  .tune button{
    flex:1 1 0; padding:4px 2px; cursor:pointer; border-radius:2px;
    font:inherit; font-size:8px; letter-spacing:.06em; color:var(--cream);
    background:rgba(243,223,185,.1); border:1px solid rgba(243,223,185,.2);
  }
  .tune button:hover{background:rgba(243,223,185,.2)}
  .tune .note{margin:6px 0 0; opacity:.4; line-height:1.35}

  @media (prefers-reduced-motion: reduce){ .mark .caret{animation:none} }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="stage">
  <!-- Each box gets its own clearing, scaled by the number: data-zone is
       grass-only, data-bare is nothing at all. Links are bare so a menu
       reads as cleared ground; the wordmark and the sub-pages' messages
       keep grass under them. Hidden views measure 0x0 and are skipped,
       so the clearings re-shape themselves when the page changes. -->
  <div class="mark" data-view="home">
    <!-- data-zone goes on an inline span, not the h1: a block stretches
         to its widest sibling, so the h1 measured the nav row's width and
         the wordmark got a clearing half the screen wide. An inline box
         is the union of its line boxes -- the text and nothing else. -->
    <h1><span data-zone="1">dayspells<span class="caret">_</span></span></h1>
    <nav class="nav">
      <a data-bare="1" href="#listen">listen</a>
      <a data-bare="1" href="https://www.instagram.com/dayspells" target="_blank" rel="noopener noreferrer">follow</a>
      <a data-bare="1" href="#shows">shows</a>
      <a data-bare="1" href="#shop">shop</a>
    </nav>
  </div>

  <div class="mark" data-view="listen" hidden>
    <ul class="stack">
      <li><a data-bare="1" href="https://dayspells.bandcamp.com/" target="_blank" rel="noopener noreferrer">bandcamp</a></li>
      <li><a data-bare="1" href="https://music.apple.com/us/artist/dayspells/1722783976" target="_blank" rel="noopener noreferrer">apple music</a></li>
      <li><a data-bare="1" href="https://open.spotify.com/artist/4VRMA334TNEAriNz0hdn35" target="_blank" rel="noopener noreferrer">spotify</a></li>
    </ul>
  </div>

  <div class="mark" data-view="shows" hidden>
    <p class="say"><span data-zone="1">stay tuned for upcoming dates</span></p>
  </div>

  <div class="mark" data-view="shop" hidden>
    <p class="say"><span data-zone="1">coming soon</span></p>
  </div>
</div>
<a class="back" id="back" href="#home" data-bare="0.8" aria-label="back" hidden>&lt;</a>
<p class="hint" id="hint">move through the field</p>
<div class="loading" id="loading">threading</div>

<div class="tools">
  <button id="tWander" aria-pressed="false" title="drift the colors">wander</button>
  <button id="tRegrow" title="resow the field">regrow</button>
  <button id="tOptions" aria-expanded="false" aria-controls="tune">tweak</button>
</div>
<div class="tune" id="tune" hidden>
  <div id="tuneBody"></div>
  <div class="row">
    <button id="tCopy">copy json</button>
    <button id="tReset">reset</button>
  </div>
  <p class="note" id="tuneNote">auto-regrows 4s after a change.</p>
</div>

<script id="payload" type="application/json"></script>
<script>
/* ==================================================================
   dayspells

   The meadow is built from photographs of two crewelwork panels.
   How the assets were made:
     1. Foreground = normalised Lab distance from the linen, whose
        colour is the dominant chroma mode of the whole panel.
     2. The foreground is sorted into colour families. A bloom is a
        contiguous patch of ANY petal colour -- the white irises have
        purple outlines, so one colour alone shatters them.
     3. A bloom is closed across whatever crosses it, then intersected
        back with the foreground: crossing wool is kept in its own
        colour, crossing linen is not. Occluders stay put on purpose.
     4. Fused heads are separated by watershed on the distance
        transform, accepted on a share of the parent rather than a
        pixel count so the rule fits both fat daffodils and slim irises.
     5. Brightness and saturation graded in at bake time, so the
        browser does no per-frame colour work.
   The ground is a 512px square of the cleanest bare linen in either
   panel, made to tile by rolling and cross-fading the seam.

   Nothing here is drawn by hand. Every pixel is wool.

   window.regrow()      -- resow the field without reloading
   window.density()     -- governor state
   window.tune(obj)     -- apply a saved tuning JSON
================================================================== */

/* Served from a dev server, the payload is fetched. In dist/ it has been
   inlined into the <script id="payload"> tag above. Both work. */
let DATA = null;
async function loadData(){
  const el = document.getElementById('payload');
  const inline = el.textContent.trim();
  if(inline) return JSON.parse(inline);
  const res = await fetch('assets/payload.json');
  if(!res.ok) throw new Error('assets/payload.json missing -- run: python pipeline/build.py');
  return res.json();
}

const canvas  = document.getElementById('field');
const ctx     = canvas.getContext('2d', {alpha:false, desynchronized:true});
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hint    = document.getElementById('hint');
const loading = document.getElementById('loading');

const rnd  = (a,b)=>a+Math.random()*(b-a);
const pick = arr=>arr[(Math.random()*arr.length)|0];

const SHRINK = 0.30;   // assets draw at 30% of source size, before P.size

/* ---------- tunable ---------------------------------------------- */
/* Everything the panel drives. window.tune(obj) applies a saved set. */
/* Dialled in on the panel, then pasted back here. */
const DEFAULTS = {
  rustle:  3.00,   // how hard the cursor knocks a plant
  speed:   0.70,   // how fast it swings -- scales the spring frequency
  settle:  1.50,   // how long it keeps swaying afterwards
  radius:  150,    // how far from the cursor the wake reaches, in px

  /* Colour is a tint plus a gain rather than three channel sliders.
     The tint is normalised to its brightest channel, so it carries hue
     only and white is neutral; the gain then does brightness. Two
     controls instead of three, and you pick a colour by looking at it. */
  /* Hue is the one-slider mood control: it rotates every colour at once
     and keeps the relationships between them, so the wool still reads as
     wool at 200 degrees round. Saturation runs from grey to lurid. */
  bgTint: '#ffffff', bgGain: 1.22, bgHue: 0, bgSat: 0.60,
  fgTint: '#ffffff', fgGain: 1.35, fgHue: 0, fgSat: 0.80,

  ground:  0.34,   // linen tile scale. lower = finer weave, more zoomed out
  density: 1.80,

  /* The field grows in: sprites are baked at size and drawn scaled from
     sizeFrom up to it over grow seconds. Set grow to 0 for none. */
  sizeFrom: 0.20,
  size:     1.70,
  grow:     6.0,

  /* The words. markSize also widens the clearing sown around them, so
     the name does not end up sitting in undergrowth -- but that part is
     in seed(), and deliberately does NOT queue an auto-regrow: the type
     resizes instantly while the field would re-scatter underneath it a
     few seconds later, which is worse than a stale clearing. The
     clearing catches up on the next regrow. */
  /* Multiplier on the wander step rate. 1.0 is the original pace. */
  wanderSpeed: 2.00,

  markSize:  1.30,
  markColor: '#f4451f',

  /* Relative amount of each colour of bloom, and of loose grass. 1.0 is
     "whatever the role weight already said". These multiply the pool, so
     they trade against each other rather than adding plants. */
  mixPurple: 0.25,
  mixWhite:  1.55,
  mixYellow: 0.80,
  mixPink:   0.65,
  mixGrass:  0.20,

  /* The governor thins the field to hold frame rate. It is why plants
     can vanish a few seconds after load on a big window. Off = draw
     everything sown, whatever it costs. */
  autothin: 0
};

/* Which mix slider an asset answers to, from its name. The crocuses are
   role 'small' rather than 'flower', but they read as purple, so they
   move with the irises. Stems are deliberately NOT in 'grass': they are
   paired to flower heads, and thinning them would strand the flowers. */
const MIX = [
  [/^(iris-purple|crocus)/, 'mixPurple'],
  [/^(iris-white|narcissus)/, 'mixWhite'],
  [/^daffodil/,              'mixYellow'],
  [/^iris-pink/,             'mixPink'],
  [/^blade/,                 'mixGrass']
];
/* Colour helpers, shared by the wordmark and the contrast probe. */
function rgbToHsl(r255, g255, b255){
  const r = r255/255, g = g255/255, b = b255/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn;
  const l = (mx+mn)/2;
  let h = 0, s = 0;
  if(d){
    s = l > 0.5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx === r ? ((g-b)/d + (g<b ? 6 : 0)) : mx === g ? (b-r)/d + 2 : (r-g)/d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hslToHex(h, s, l){
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2*l - 1)) * s, x = c * (1 - Math.abs((h/60) % 2 - 1)), m = l - c/2;
  const [r,g,b] = h < 60  ? [c,x,0] : h < 120 ? [x,c,0] : h < 180 ? [0,c,x]
                : h < 240 ? [0,x,c] : h < 300 ? [x,0,c] : [c,0,x];
  const hx = v=>Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#' + hx(r) + hx(g) + hx(b);
}
function hexToHsl(hex){
  const n = parseInt(String(hex).slice(1), 16);
  return rgbToHsl((n>>16)&255, (n>>8)&255, n&255);
}
/* Shortest way round the circle, so 350 -> 10 goes forwards through 0
   rather than the long way back through 180. */
function lerpHue(a, b, t){
  const d = ((b - a + 540) % 360) - 180;
  return (a + d*t + 360) % 360;
}

/* ---------- contrast probe ---------------------------------------- */
/* What colour should the wordmark be to stand against what is actually
   behind it? Reading the canvas is the obvious answer and the obvious
   trap: getImageData forces a GPU-to-CPU readback and stalls the
   pipeline. So read as little as possible, as rarely as tolerable --
   downscale only the box the wordmark occupies into a 24x12 offscreen
   and read that. 288 pixels, six times a second.

   Straight RGB inversion does not work: invert a mid grey and you get a
   mid grey. Take the complementary hue for colour separation, and flip
   lightness to whichever end the backdrop is not, for luminance
   separation. That second half is what makes it legible; the first is
   what makes it interesting. */
const PROBE_W = 24, PROBE_H = 12;
let probe = null, probeG = null;

function sampleBackdrop(){
  /* The visible view, not the wordmark: on the sub-pages there is no h1,
     and the box that matters is whatever type is standing in the middle.
     Its own padding already reaches past the letterforms, so the extra
     margin is smaller here than the 0.3 the bare h1 rect needed. */
  const el = document.querySelector('[data-view]:not([hidden])');
  if(!el || !canvas.width) return null;
  if(!probe){
    probe = document.createElement('canvas');
    probe.width = PROBE_W; probe.height = PROBE_H;
    probeG = probe.getContext('2d', {willReadFrequently:true});
  }
  const r = el.getBoundingClientRect();
  const pad = 0.08;
  let x = (r.left - r.width*pad) * DPR,  y = (r.top - r.height*pad) * DPR;
  let w = r.width * (1 + 2*pad) * DPR,   h = r.height * (1 + 2*pad) * DPR;
  x = Math.max(0, Math.min(canvas.width  - 1, x));
  y = Math.max(0, Math.min(canvas.height - 1, y));
  w = Math.max(1, Math.min(canvas.width  - x, w));
  h = Math.max(1, Math.min(canvas.height - y, h));
  probeG.drawImage(canvas, x, y, w, h, 0, 0, PROBE_W, PROBE_H);
  const d = probeG.getImageData(0, 0, PROBE_W, PROBE_H).data;
  let R = 0, G = 0, B = 0;
  for(let i = 0; i < d.length; i += 4){ R += d[i]; G += d[i+1]; B += d[i+2]; }
  const n = d.length / 4;
  return [R/n, G/n, B/n];
}

function contrastHsl(rgb){
  const [h, s, l] = rgbToHsl(rgb[0], rgb[1], rgb[2]);
  return [
    (h + 180) % 360,                                   // opposite hue
    Math.min(1, Math.max(0.6, s * 1.3 + 0.35)),        // keep it vivid
    l > 0.5 ? 0.22 : 0.80                              // opposite end of light
  ];
}

function applyMark(){
  const r = document.documentElement.style;
  r.setProperty('--mark-scale', P.markSize);
  r.setProperty('--mark-color', P.markColor);
}

function mixOf(a){
  if(a.role === 'stem') return 1;   // stems are named blade-* too, but they
  for(const [re, k] of MIX)         // are paired to heads, not scattered
    if(re.test(a.n)) return P[k];
  return 1;
}
const P = {...DEFAULTS};

/* Plants are sown in clusters, not one at a time: a flower head is
   paired with a stem beneath it, and heads come 1-3 to a clump. */
const CLUSTER = {flower:[1,3], grass:[2,4]};
const STEM_PAIR = 0.85;         // chance a head gets a stem under it

/* ---------- load ------------------------------------------------- */
function loadImg(src){
  return new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; });
}

/* A hex tint plus a gain, as per-channel multipliers. Normalising the
   tint to its brightest channel keeps hue and brightness independent,
   so white is exactly neutral at any gain. */
function gains(hex, gain){
  const n = parseInt(String(hex).slice(1), 16);
  const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  const m = Math.max(r, g, b) || 255;
  return [r/m*gain, g/m*gain, b/m*gain];
}

/* Colour is one 3x3 matrix: gain and tint, then hue rotation, then
   saturation. Composing them means a single pass over the pixels however
   many of the four are in play. Luminance coefficients are the sRGB ones
   the SVG filter spec uses, so a hue rotation holds its brightness. */
const LR = 0.213, LG = 0.715, LB = 0.072;
const IDENTITY = [1,0,0, 0,1,0, 0,0,1];

function matMul(a, b){
  const o = new Array(9);
  for(let i=0;i<3;i++) for(let j=0;j<3;j++)
    o[i*3+j] = a[i*3]*b[j] + a[i*3+1]*b[3+j] + a[i*3+2]*b[6+j];
  return o;
}
function hueMat(deg){
  const a = deg*Math.PI/180, c = Math.cos(a), s = Math.sin(a);
  return [
    LR + c*(1-LR) - s*LR,      LG - c*LG - s*LG,        LB - c*LB + s*(1-LB),
    LR - c*LR + s*0.143,       LG + c*(1-LG) + s*0.140, LB - c*LB - s*0.283,
    LR - c*LR - s*(1-LR),      LG - c*LG + s*LG,        LB + c*(1-LB) + s*LB
  ];
}
function satMat(s){
  return [
    LR + s*(1-LR), LG - s*LG,     LB - s*LB,
    LR - s*LR,     LG + s*(1-LG), LB - s*LB,
    LR - s*LR,     LG - s*LG,     LB + s*(1-LB)
  ];
}
function colourMatrix(hex, gain, hue, sat){
  const g = gains(hex, gain);
  const m = matMul(satMat(sat), matMul(hueMat(hue), [g[0],0,0, 0,g[1],0, 0,0,g[2]]));
  return m;
}

function isFlat(M){
  for(let i=0;i<9;i++) if(Math.abs(M[i]-IDENTITY[i]) > 1e-4) return false;
  return true;
}

/* Apply the matrix to a context in place. Alpha is left alone, so
   cutouts keep their edges. */
function applyMatrix(g, w, h, M){
  if(isFlat(M)) return;
  const d = g.getImageData(0, 0, w, h), px = d.data;
  for(let i=0;i<px.length;i+=4){
    const r = px[i], gg = px[i+1], b = px[i+2];
    px[i]   = Math.max(0, Math.min(255, M[0]*r + M[1]*gg + M[2]*b));
    px[i+1] = Math.max(0, Math.min(255, M[3]*r + M[4]*gg + M[5]*b));
    px[i+2] = Math.max(0, Math.min(255, M[6]*r + M[7]*gg + M[8]*b));
  }
  g.putImageData(d, 0, 0);
}

/* Geometry and the contact shadow, cached per asset. The shadow is the
   sprite's own alpha filled flat and blurred, so it does not depend on
   colour at all -- it only has to be rebuilt when the draw size changes.
   Everything here allocates; nothing here runs on a colour change. */
function ensureBake(a){
  /* Bake at the resolution the CANVAS renders at, not the screen's.
     This used to be min(2.2, devicePixelRatio*1.2), which on a retina
     display baked at 2.2 while the canvas ran at DPR 1.5 -- every plant
     then read 2.16x more source pixels than it wrote, and paid for a
     downscale filter on top, on every blit of every frame. The 1.15 is
     headroom for the largest per-plant scale (p.s tops out near 1.3);
     beyond that a plant softens slightly rather than costing everyone. */
  const q  = Math.min(2.0, DPR * 1.15);
  const sc = SHRINK * P.size;
  const dw = a.w*sc, dh = a.h*sc;
  const mw = Math.max(2, Math.round(dw*q)), mh = Math.max(2, Math.round(dh*q));
  if(a.mw === mw && a.mh === mh) return;          // geometry unchanged

  const pad = Math.max(3, Math.round(4*q));
  a.mw = mw; a.mh = mh; a.pad = pad;
  a.body = document.createElement('canvas');
  a.body.width = mw; a.body.height = mh;
  a.cv = document.createElement('canvas');
  a.cv.width = mw + pad*2; a.cv.height = mh + pad*2;

  const sil = document.createElement('canvas');
  sil.width = a.cv.width; sil.height = a.cv.height;
  const sg = sil.getContext('2d');
  sg.imageSmoothingQuality = 'high';
  sg.drawImage(a.img, pad, pad, mw, mh);
  sg.globalCompositeOperation = 'source-in';
  sg.fillStyle = 'rgba(26,19,11,.34)';
  sg.fillRect(0, 0, sil.width, sil.height);

  a.shadow = document.createElement('canvas');
  a.shadow.width = sil.width; a.shadow.height = sil.height;
  const hg = a.shadow.getContext('2d');
  try { hg.filter = 'blur(' + (3*q).toFixed(1) + 'px)'; } catch(e){}
  hg.drawImage(sil, 1.6*q, 2.2*q);

  const pd = pad*dw/mw;                            // pad, in display px
  a.dw = dw; a.dh = dh; a.stem = a.stemSrc*sc;
  a.pd = pd; a.cw = dw + pd*2; a.ch = dh + pd*2;
  a.dx = -dw/2 - pd; a.dy = -dh - a.stem - pd;
}

/* The colour path, and the only thing wander runs. No allocation, no
   blur, and the source is scaled down BEFORE the matrix is applied --
   the same commute the ground uses, and it cuts the per-pixel work by
   about four. */
function recolour(a, M){
  ensureBake(a);
  const bg = a.body.getContext('2d', {willReadFrequently:true});
  bg.clearRect(0, 0, a.mw, a.mh);
  bg.imageSmoothingQuality = 'high';
  bg.drawImage(a.img, 0, 0, a.mw, a.mh);
  applyMatrix(bg, a.mw, a.mh, M);

  const g = a.cv.getContext('2d');
  g.clearRect(0, 0, a.cv.width, a.cv.height);
  g.drawImage(a.shadow, 0, 0);
  g.drawImage(a.body, a.pad, a.pad);
}

let ASSETS = [], linenImg = null, linenPat = null;
const pickDPR = ()=>Math.min(1.5, devicePixelRatio || 1);

/* ASSETS objects are created once and mutated in place, so a colour or
   size change re-bakes the sprites without disturbing the field the
   plants are already standing in. */
function plantMatrix(){ return colourMatrix(P.fgTint, P.fgGain, P.fgHue, P.fgSat); }

function rebakePlants(){
  const M = plantMatrix();
  ASSETS.forEach(a=>recolour(a, M));
}

/* Wander re-colours continuously, and re-baking all 26 sprites costs
   ~12ms -- most of a frame. So spread it: a few sprites per frame,
   round-robin, and the whole set refreshes in about a sixth of a second.
   The colour moves slowly enough that the skew between the first sprite
   and the last is invisible. */
let bakeCursor = 0;
function rebakeSome(n){
  if(!ASSETS.length) return;
  const M = plantMatrix();
  for(let i=0;i<n;i++){
    recolour(ASSETS[bakeCursor % ASSETS.length], M);
    bakeCursor++;
  }
}

/* Pre-scaled to an integer tile, so repeating never seams. P.ground
   below 1 shrinks the weave -- the panel is shot close, and at 1:1 the
   linen reads as burlap rather than as ground seen from above.
   Scale FIRST, then colour: the matrix is linear and downscaling is a
   weighted average, so the two commute except where a channel clips,
   and doing it in this order works on ~76k pixels instead of 262k. That
   took the tile from 7.1ms to about 2, which is what makes it cheap
   enough to re-colour several times a second while wandering. */
function rebakeGround(){
  if(!linenImg) return;
  const s = Math.max(24, Math.round(linenImg.width * P.ground));

  /* Scratch. willReadFrequently pins a canvas to CPU memory, which is
     right for something we getImageData out of -- and wrong for anything
     drawn from afterwards. */
  const src = document.createElement('canvas');
  src.width = s; src.height = s;
  const sg = src.getContext('2d', {willReadFrequently:true});
  sg.imageSmoothingQuality = 'high';
  sg.drawImage(linenImg, 0, 0, s, s);
  applyMatrix(sg, s, s, colourMatrix(P.bgTint, P.bgGain, P.bgHue, P.bgSat));

  /* The pattern source must NOT carry that flag. This pattern fills the
     whole canvas on every single frame, and a CPU-backed source drags
     that fill off the GPU path -- which a software rasteriser cannot
     show you, because it has no GPU path to fall off. That is how this
     got past a headless benchmark and made the page unusable on a real
     machine. Copy into a clean canvas and pattern from that. */
  const tile = document.createElement('canvas');
  tile.width = s; tile.height = s;
  tile.getContext('2d').drawImage(src, 0, 0);
  linenPat = ctx.createPattern(tile, 'repeat');
}

/* ---------- wander ------------------------------------------------ */
/* Four slow oscillators on the hue and saturation of ground and plants.
   The periods are primes and deliberately unequal, so the four never
   line up again in any useful timeframe -- 43x59x71x89 seconds is a
   beat period of about four months. That is the point: the combinations
   drift somewhere neither of us would have chosen. */
/* Stepped, not continuous. Re-colouring every frame costs 15.4ms of a
   16.7ms budget -- measured, and far more than the 1.4ms the synchronous
   timings suggested, because allocating canvases and running the shadow
   blur bills long after the call returns. Stepping in discrete jumps a
   few times a second gets the same drifting-colour effect for a fraction
   of the work, and the steps read as deliberate rather than janky.

   Each walker bounces between its bounds on its own interval. The
   intervals are deliberately unequal and share no common factor worth
   speaking of, so the four never line up and the combinations go
   somewhere neither of us would have picked. Hue steps fastest; the
   saturations crawl. The two that drive the plants are the slow ones on
   purpose -- the ground is a single small tile to re-colour (~2ms), the
   plants are 26 sprites. */
const WANDER = [
  {k:'bgHue', step:5,    every:0.25, lo:0,    hi:360,  dir: 1, t:0, ground:1},
  {k:'fgHue', step:5,    every:0.40, lo:0,    hi:360,  dir:-1, t:0, ground:0},
  {k:'bgSat', step:0.06, every:0.65, lo:0,    hi:2.5,  dir: 1, t:0, ground:1},
  {k:'fgSat', step:0.05, every:0.75, lo:0,    hi:2.5,  dir:-1, t:0, ground:0}
];
/* If wander ever feels heavy on a given machine, these two intervals are
   the knob: fgHue and fgSat are the ones that re-colour 26 sprites,
   bgHue and bgSat only redo one small tile. Doubling them halves the
   cost and barely changes how the drift reads. */
let wandering = false, plantQueue = 0;
/* Wordmark hue, carried outside P: the words expose a colour, not a
   hue, so this seeds from whatever colour is set when wander starts
   and writes the result back into P.markColor as it turns. */
/* Current wordmark colour in HSL, and the contrast target it is
   easing toward. Held outside P because the words expose a colour,
   not a hue; the result is written back into P.markColor. */
let markH = 0, markS = 0, markL = 0, markT = 0, swatchT = 0;
let tgtH = 0, tgtS = 0, tgtL = 0;
const PROBE_EVERY = 0.08;   // 12.5Hz. The readback is the cost, not the maths;
                            // at 0.73ms a probe that is still under 1% of budget.
const MARK_EASE   = 5.0;    // how fast the text walks to a new target

function stepWander(dt){
  let needGround = false, needPlants = false;   // not `plants` -- that's the field
  for(const w of WANDER){
    w.t += dt;
    if(w.t < w.every / Math.max(0.05, P.wanderSpeed)) continue;
    w.t = 0;
    let v = P[w.k] + w.dir*w.step;
    if(v >= w.hi){ v = w.hi; w.dir = -1; }
    else if(v <= w.lo){ v = w.lo; w.dir = 1; }
    P[w.k] = v;
    if(w.ground) needGround = true; else needPlants = true;
  }
  /* Re-probe on a slow clock; ease toward the answer every frame, so
     the text glides rather than snapping each time it re-reads. */
  markT += dt;
  if(markT >= PROBE_EVERY){
    markT = 0;
    const avg = sampleBackdrop();
    if(avg){ const t = contrastHsl(avg); tgtH = t[0]; tgtS = t[1]; tgtL = t[2]; }
  }
  const k = Math.min(1, dt * MARK_EASE);
  markH = lerpHue(markH, tgtH, k);
  markS += (tgtS - markS) * k;
  markL += (tgtL - markL) * k;
  P.markColor = hslToHex(markH, markS, markL);
  document.documentElement.style.setProperty('--mark-color', P.markColor);
  swatchT += dt;                     // the swatch does not need 60Hz
  if(swatchT >= 0.12){
    swatchT = 0;
    const mi = inputs.markColor;
    if(mi) mi.el.value = P.markColor;
  }
  if(needGround) rebakeGround();
  if(needPlants) plantQueue = ASSETS.length;   // spread the re-bake over frames
  if(plantQueue > 0){
    const n = Math.min(2, plantQueue);
    rebakeSome(n);
    plantQueue -= n;
  }
  if(needGround || needPlants) syncWanderInputs();
}

/* ---------- breathing -------------------------------------------- */
/* While wander is on, blooms change size as well as colour: a flower is
   picked at random and eases a step up or a step down, then stops there.

   Both moves are relative to where the plant already is: an up-step
   multiplies by 1.5, a down-step halves. So a bloom sitting at the
   grow-in end size blows up to 150% of it, one sitting at 20% goes to
   30%, and three or four "down" draws in a row put it at the grow-in
   START size -- the same speck the whole field begins as on load. The
   ceiling is 150%; the floor is sizeFrom/size.

   The coin is not 50/50, and that is not a style choice. Halving is a
   bigger move than multiplying by 1.5 -- ln 2 against ln 1.5 -- so a
   fair coin drifts the whole meadow downward and it settles at a
   fraction of its size after a few minutes, which reads as the field
   wilting rather than breathing. BREATHE_FAIR is the weighting that
   makes the walk stand still, derived from the two step sizes so it
   stays right if they are re-tuned. On top of that sits a gentle pull
   back toward the sown size, which is what stops the spread widening
   forever and brings the deep dives home again.

   This is a DRAW-TIME scale, like grow-in and for the same reason: the
   sprite is already blitted through a scaling setTransform, so an extra
   factor costs one multiply. Re-baking a sprite to resize it would cost
   an order of magnitude more than the whole rest of the frame.

   Only a handful are in flight at once (rate x settle time, about 18),
   so the update walks a short list rather than all 3300 plants. Picks
   come from a bloom-only list built at sowing time, not from the whole
   field -- two thirds of the meadow is grass and stems, so picking at
   large would have made the rate below mean a third of what it says. */
const BREATHE_UP     = 1.50;          // an up-step multiplies by this
const BREATHE_DOWN   = 0.50;          // a down-step multiplies by this
const BREATHE_HI     = 1.50;          // 150% of the grow-in end size
const BREATHE_RATE   = 200;           // blooms started per second
const BREATHE_EASE   = 0.9;           // ~1.1s time constant
const BREATHE_REVERT = 0.45;          // how hard the coin leans back to 1.0
/* The coin that leaves the walk standing still, given the two steps. */
const BREATHE_FAIR   = Math.log(1/BREATHE_DOWN) /
                       (Math.log(BREATHE_UP) + Math.log(1/BREATHE_DOWN));
let breathing = [], breatheAcc = 0, blooms = [];

function stepBreathe(dt){
  /* Not during grow-in. The whole field is already ramping from
     sizeFrom up to size, and a second scale animation on top of that
     just fights it -- so the breathing waits for the end size. */
  const grown = P.grow <= 0 || growT >= P.grow;
  if(wandering && grown && blooms.length){
    /* The floor is the grow-in start size, expressed the same way the
       draw scale is -- sprites are baked at size end, so sizeFrom/size
       is exactly the speck the field begins as on load. Read per frame
       because both are live panel values. */
    const lo = P.size > 0 ? Math.min(0.9, P.sizeFrom / P.size) : 0.1;
    breatheAcc += dt * BREATHE_RATE;
    while(breatheAcc >= 1){
      breatheAcc -= 1;
      const p = blooms[(Math.random()*blooms.length)|0];
      if(p.gT !== p.g) continue;                                 // already moving
      /* The neutral coin, plus a lean toward the size it was sown at.
         Clamped at both ends so a bloom at the floor still has a real
         chance of going further down, and one at the ceiling of going
         further up -- neither end is a trap. */
      const up = Math.min(0.92, Math.max(0.12,
                 BREATHE_FAIR + BREATHE_REVERT*(1 - p.g)));
      const t = p.g * (Math.random() < up ? BREATHE_UP : BREATHE_DOWN);
      p.gT = Math.min(BREATHE_HI, Math.max(lo, t));
      if(p.gT !== p.g) breathing.push(p);
    }
  }
  for(let i = breathing.length - 1; i >= 0; i--){
    const p = breathing[i];
    p.g += (p.gT - p.g) * Math.min(1, dt*BREATHE_EASE);
    if(Math.abs(p.gT - p.g) < 0.002){ p.g = p.gT; breathing.splice(i, 1); }
  }
}

/* Wander off puts the meadow back the way it was found, the same way
   the colours land cleanly -- otherwise the field keeps whatever sizes
   it happened to stop on. Eased, not snapped. */
function breatheHome(){
  breathing.length = 0;
  for(const p of plants) if(p.g !== 1 || p.gT !== 1){ p.gT = 1; breathing.push(p); }
}

/* The sliders should be seen to move -- that is half the appeal. Ten
   times a second is plenty and keeps the DOM writes off the hot path. */
function syncWanderInputs(){
  for(const w of WANDER){
    const i = inputs[w.k];
    if(!i) continue;
    i.el.value = P[w.k];
    if(i.out) i.out.textContent = (+P[w.k]).toFixed(w.k.endsWith('Hue') ? 0 : 2);
  }
}

function setWander(on){
  wandering = on;
  if(on){
    const hsl = hexToHsl(P.markColor);
    markH = hsl[0]; markS = hsl[1]; markL = hsl[2]; markT = PROBE_EVERY; swatchT = 0;
    const avg = sampleBackdrop();
    const t = avg ? contrastHsl(avg) : [markH, markS, markL];
    tgtH = t[0]; tgtS = t[1]; tgtL = t[2];
  }
  const b = document.getElementById('tWander');
  if(b) b.setAttribute('aria-pressed', String(on));
  if(!on){ rebakePlants(); rebakeGround(); syncWanderInputs(); breatheHome(); }  // land cleanly
}

async function boot(){
  try { DATA = await loadData(); }
  catch(e){ loading.textContent = e.message; console.error(e); return; }
  linenImg   = await loadImg(DATA.linen);
  const imgs = await Promise.all(DATA.assets.map(a=>loadImg(a.d)));
  DATA.assets.forEach((a,i)=>{
    if(!imgs[i]) return;
    ASSETS.push({...a, img: imgs[i], stemSrc: a.stem});
  });
  DPR = pickDPR();          // ensureBake reads this
  rebakePlants();
  rebakeGround();
  applyMark();
  buildPanel();
  showView(viewFromHash(), false);
  loading.dataset.done = 'true';
  resize();
  booted = true;
  requestAnimationFrame(frame);
  /* The clearings are measured off the type, so they are only right once
     the type is set in the right face. Space Mono arrives over the
     network and the fallback is a different width; without this the
     first field is sown around a wordmark that is not the one you end up
     looking at. Resolves immediately when the font is cached or absent. */
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>seed());
}

/* ---------- field ------------------------------------------------ */
let W=0, H=0, DPR=1, plants=[], vig=null;

/* Relative density per role, normalised by how many assets that role has,
   so adding assets to a role makes it more varied rather than denser. */
const WEIGHT = {grass:5.0, stem:3.2, small:2.0, clump:1.0, flower:2.3};

/* A meadow does not grow one stem at a time. Plants are sown in
   clusters: a head with a stem under it, 1-3 heads to a clump, 2-4
   blades to a tuft. Clusters are then scattered by colony, so like
   still grows near like. */
function seed(){
  plants = [];
  if(!ASSETS.length) return;

  const byRole = {};
  ASSETS.forEach(a=>(byRole[a.role] = byRole[a.role] || []).push(a));
  const heads  = [].concat(byRole.flower||[], byRole.small||[], byRole.clump||[]);
  const stems  = byRole.stem  || [];
  const blades = byRole.grass || [];
  if(!heads.length && !blades.length) return;

  /* Repeat each asset in its pool by role weight, normalised by how many
     assets that role has -- so adding assets makes a role more varied
     rather than denser -- then by the mix multiplier for its colour.
     Role alone cannot express "fewer purple, more white": the purple and
     the white irises are both role 'flower'. Reps are kept as floats and
     resolved probabilistically, or a 20% change to a set of three
     assets would round away to nothing. */
  function pool(list){
    const out = [], by = {};
    list.forEach(a=>(by[a.role] = by[a.role] || []).push(a));
    Object.keys(by).forEach(role=>{
      const set = by[role];
      set.forEach(a=>{
        const n = (WEIGHT[role]||1)*30/set.length * mixOf(a);
        const whole = Math.floor(n);
        const reps = whole + (Math.random() < n - whole ? 1 : 0);
        for(let i=0;i<reps;i++) out.push(a);
      });
    });
    return out;
  }
  const headPool = pool(heads), bladePool = pool(blades);

  /* Weights are shares of PLANTS, but we sow whole clusters, so divide
     each side by how many plants its cluster typically holds. */
  const perFlower = (CLUSTER.flower[0]+CLUSTER.flower[1])/2 * (1 + STEM_PAIR);
  const perGrass  = (CLUSTER.grass[0] +CLUSTER.grass[1]) /2;
  const wG = bladePool.length/perGrass, wF = headPool.length/perFlower;
  const grassShare = (wG + wF) > 0 ? wG/(wG + wF) : 0;

  const span = Math.min(W,H);
  const colony = new Map();
  ASSETS.forEach(a=>{
    const k = 2 + (Math.random()*4|0), cs = [];
    for(let i=0;i<k;i++) cs.push({
      x: rnd(-0.12,1.12)*W, y: rnd(-0.18,1.18)*H, r: rnd(0.10,0.30)*span
    });
    colony.set(a, cs);
  });

  /* Hard ceiling on plants, whatever the density says. It was 3200,
     which the slider hit at density ~1.7 on a 1440x900 window -- so
     anything above that was inert. Raised so the top of the slider
     actually means something; the governor is what protects frame rate,
     not this. */
  const target = Math.min(8000, Math.max(260, Math.round(W*H/700*P.density)));

  /* Grass-only zones. Type sits badly on a bed of flowers -- too much
     colour and too much silhouette right where the eye needs to resolve
     letterforms. Inside a zone, a cluster that would have been blooms is
     sown as blades instead, at full grass weight regardless of what the
     mix says. It is not a hole in the field; it is a different planting.

     There is no longer one clearing at a fixed place. Every element
     carrying data-zone measures its OWN box and gets its own ellipse:
     the wordmark, each nav link, each link on the listen page, the back
     caret. Hidden views measure 0x0 and drop out, so switching pages
     re-shapes the clearings with no per-view constants -- and markSize
     still scales them, because it scales the type they are measured off.

     The pad is ADDITIVE in em, not a multiplier on the box. That is what
     makes it transferable: a multiplier gives a two-line paragraph twice
     the margin of a one-line one, and gives a four-letter word a quarter
     of the wordmark's. These two numbers reproduce the old hand-tuned
     wordmark clearing to within a pixel (383x100 against 383x101). */
  const ZONE_PAD_X = 0.18, ZONE_PAD_Y = 0.65;   // em, added to the half-box
  /* Each clearing is cut short above its type so flower heads come
     closer from the top, and left full below. It shortens the PAD, not
     the whole semi-axis: scale the axis and a two-line paragraph loses
     its top margin to its own extra height, so "stay tuned for upcoming
     dates" had 7px of air above it where the wordmark had 31. Applied to
     the pad, the clearance above type is a flat 0.39em whatever the type
     is, and the wordmark's clearing comes out within 3px of the value it
     was hand-tuned to. */
  const ZONE_TOP = 0.60;

  /* Two kinds of clearing, same geometry. data-zone is grass-only: the
     wordmark and the sub-pages' one-line messages, which want something
     growing under them. data-bare is nothing at all, linen showing
     through -- every link on the site, so a menu reads as cleared ground
     rather than as words lying in a flower bed. */
  const zones = [], bareZones = [];
  document.querySelectorAll('[data-zone],[data-bare]').forEach(el=>{
    const r = el.getBoundingClientRect();
    if(r.width < 1 || r.height < 1) return;              // hidden view
    const fs = parseFloat(getComputedStyle(el).fontSize) || 16;
    const isBare = el.hasAttribute('data-bare');
    const k = parseFloat(isBare ? el.dataset.bare : el.dataset.zone) || 1;
    (isBare ? bareZones : zones).push({
      x: r.left + r.width/2,  y: r.top + r.height/2,
      ax: (r.width/2 + fs*ZONE_PAD_X) * k,
      ay: (r.height/2 + fs*ZONE_PAD_Y) * k,
      up: (r.height/2 + fs*ZONE_PAD_Y*ZONE_TOP) * k
    });
  });

  /* The corner links get a bare patch rather than a grass one: nothing
     is sown there at all, so the linen shows through. Two of its four
     edges run off the screen, so it reads as a cleared corner rather
     than a rectangle cut out of the middle of a meadow. */
  const BARE = 0.80;                 // margin scale around the links
  const tools = document.querySelector('.tools');
  let toolBox = null;
  if(tools){
    const r = tools.getBoundingClientRect();
    const m = Math.max(44, r.height * 1.8) * BARE;
    const ex = (r.width + 2*m) * 0.075 * BARE;
    toolBox = {x0: r.left - m - ex, y0: r.top - m,
               x1: r.right + m + ex, y1: r.bottom + m};
  }
  function inAny(list, x, y){
    for(let i=0;i<list.length;i++){
      const z = list[i];
      const dy = y - z.y;
      const ex = (x - z.x)/z.ax, ey = dy/(dy < 0 ? z.up : z.ay);
      if(ex*ex + ey*ey < 1) return true;
    }
    return false;
  }
  /* The corner links' box is a rectangle rather than an ellipse because
     two of its four edges run off the screen -- it reads as a cleared
     corner. The link clearings inside the page are ellipses like the
     rest, since all four of their edges are visible. */
  function bare(x, y){
    if(toolBox && x >= toolBox.x0 && x <= toolBox.x1
               && y >= toolBox.y0 && y <= toolBox.y1) return true;
    return inAny(bareZones, x, y);
  }

  function grassOnly(x, y){ return inAny(zones, x, y); }

  /* Everything above is in SCREEN space, but a plant is anchored at its
     foot and drawn upward, so testing the foot puts the patch a whole
     plant too high: grass rooted along the bottom of the zone grows out
     of the top of it. Every test below is therefore done on where the
     plant is SEEN, not where it is rooted. For the cluster decision the
     asset is not chosen yet, so use the field's average rise; per plant,
     use its own. */
  const meanRise = ASSETS.length
    ? 0.95 * ASSETS.reduce((t,a)=>t + (a.dh*0.55 + a.stem), 0) / ASSETS.length
    : 0;
  const rise = (a, sc)=>(a.dh*0.55 + a.stem) * sc;
  /* Multiplier on the clearing's natural grass density. Above 1 the
     pass sows more, below 1 it thins -- 1.20 was too thick. */
  const ZONE_GRASS = 0.84;

  const CELL = 16, grid = new Map();
  function crowded(x,y,r){
    const c0=((x-r)/CELL)|0, c1=((x+r)/CELL)|0, r0=((y-r)/CELL)|0, r1=((y+r)/CELL)|0;
    for(let cx=c0;cx<=c1;cx++) for(let cy=r0;cy<=r1;cy++){
      const b = grid.get(cx+','+cy);
      if(!b) continue;
      for(let i=0;i<b.length;i++){
        const dx=b[i].x-x, dy=b[i].y-y;
        if(dx*dx+dy*dy < r*r) return true;
      }
    }
    return false;
  }

  /* One rank for the whole cluster, so when the governor thins the
     field it drops whole plants and never a head without its stem. */
  /* free = skip the crowding test and stay out of the grid. Used for a
     head's companion stem, which is meant to sit directly under it: if
     the stem goes down first and takes part in the test, it blocks the
     very head it belongs to and almost no flowers survive. */
  function place(a, x, y, sc, rank, free, crowdMul){
    if(!free && crowded(x, y, Math.max(4, a.dw*sc*(crowdMul || 0.32)))) return false;
    const depth = Math.min(1, Math.max(0, (y + H*0.14)/(H*1.28)));
    const p = {
      a, x, y, s: sc,
      flip: Math.random() < 0.5 ? -1 : 1,
      lean: rnd(-0.13, 0.13),
      fade: 0.80 + depth*0.20,
      rank,
      g: 1, gT: 1,                  // breathing scale, and where it is headed
      phase: Math.random()*Math.PI*2,
      stiff: rnd(46,84), damp: rnd(5.0,7.4),
      bend:0, bendV:0, buzz:0
    };
    plants.push(p);
    if(!free){
      const k = (((x/CELL)|0) + ',' + ((y/CELL)|0));
      if(!grid.has(k)) grid.set(k, []);
      grid.get(k).push(p);
    }
    return true;
  }

  let guard = 0;
  while(plants.length < target && guard++ < target*5){
    let asGrass = bladePool.length && (!headPool.length || Math.random() < grassShare);
    let set  = asGrass ? bladePool : headPool;
    let lead = pick(set);

    let cx, cy;
    if(Math.random() < 0.62){                       // grow near its own kind
      const cs = colony.get(lead), c = cs[(Math.random()*cs.length)|0];
      const th = Math.random()*Math.PI*2;
      const d  = Math.abs(rnd(-1,1)+rnd(-1,1))*0.5*c.r;
      cx = c.x + Math.cos(th)*d; cy = c.y + Math.sin(th)*d;
    } else {                                        // volunteers
      cx = rnd(-W*0.10, W*1.10); cy = rnd(-H*0.14, H*1.14);
    }
    if(cy < -H*0.16 || cy > H*1.16 || cx < -W*0.14 || cx > W*1.14) continue;

    /* The colony picked the spot; the zone decides what grows there.
       Re-picking the lead after the fact is fine -- colonies only ever
       influenced WHERE a cluster lands, never what it is. Chosen from
       the unweighted blade list so the grass mix cannot thin these out. */
    if(bare(cx, cy - meanRise)) continue;
    if(grassOnly(cx, cy - meanRise)){
      if(!blades.length) continue;
      asGrass = true; set = blades; lead = pick(blades);
    }

    const [lo,hi] = asGrass ? CLUSTER.grass : CLUSTER.flower;
    const k    = lo + ((Math.random()*(hi-lo+1))|0);
    const wide = lead.dw * (asGrass ? 0.62 : 0.80);

    for(let i=0;i<k;i++){
      const a = i === 0 ? lead : pick(set);
      const x = cx + (i===0 ? 0 : rnd(-wide, wide));
      const y = cy + (i===0 ? 0 : rnd(-wide*0.42, wide*0.42));
      if(y < -H*0.16 || y > H*1.16) continue;
      const depth = Math.min(1, Math.max(0, (y + H*0.14)/(H*1.28)));
      const sc = (0.70 + depth*0.34) * rnd(0.80,1.24);
      /* The zone test above is on the cluster centre, and a cluster
         centred just outside can still fling a member in. Check each
         plant too -- and check where its HEAD lands, not its foot: a
         plant is anchored at the ground and drawn upward, so one rooted
         below the zone can still push a bloom into it. Must come after
         sc, which it needs to know how tall this plant draws. */
      const vy = y - rise(a, sc);
      if(bare(x, vy)) continue;                 // nothing at all in the corner
      if(!asGrass && grassOnly(x, vy)) continue;
      /* Rank is shared by a head and its own stem, so thinning never
         leaves a flower floating over nothing -- but NOT shared across
         the cluster, or the governor would drop whole clumps at once
         and the field would visibly lose patches. */
      const rank = Math.random();

      /* Head first, so it competes for the space on its own terms. Its
         stem then goes in unconditionally at a hair smaller y, which is
         what puts it behind the head once plants are sorted for drawing. */
      if(place(a, x, y, sc, rank, false)
         && !asGrass && stems.length && Math.random() < STEM_PAIR){
        /* Stems are the tallest things in the field, so one paired to
           a head that cleared the zone can still reach into it. */
        const st = pick(stems), ss = sc*rnd(0.82,1.06);
        /* Jitter first, then test. Testing at x and planting at
           x + rnd(-3,3) let a stem sitting exactly on a zone edge land
           just inside it -- one stray in ~3300, but more zones means
           more edge, so it started showing up. */
        const sx = x + rnd(-3,3), sy = y - 0.5;
        if(!bare(sx, sy - rise(st, ss)) && !grassOnly(sx, sy - rise(st, ss)))
          place(st, sx, sy, ss, rank, true);
      }
    }
  }
  /* The clearing fills only with whatever clusters happened to centre
     inside it, which leaves it thinner than the field around it. Top it
     up with single blades until it carries ZONE_GRASS more than it did.
     A tighter crowding radius is what makes room -- at the default the
     zone is already packed and every extra blade would be refused. */
  if(blades.length && zones.length){
    const seen = p => grassOnly(p.x, p.y - rise(p.a, p.s));
    let have = plants.filter(seen).length;
    const want = Math.round(have * ZONE_GRASS);

    if(want < have){                   // thin it back out again
      const idx = [];
      plants.forEach((p, i)=>{ if(seen(p)) idx.push(i); });
      for(let i = idx.length - 1; i > 0; i--){
        const j = (Math.random()*(i+1))|0; const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      const drop = new Set(idx.slice(0, have - want));
      plants = plants.filter((p, i)=>!drop.has(i));
      have = want;
    }

    /* Pick which clearing to sow into by AREA, not uniformly, or a nav
       link's little ellipse would get as many blades as the wordmark's
       and end up matted while the wordmark stayed thin. */
    const areas = zones.map(z=>z.ax*z.ay);
    const total = areas.reduce((s,v)=>s+v, 0);

    let g2 = 0;
    while(have < want && g2++ < want*12){
      let r = Math.random()*total, zi = 0;
      while(zi < zones.length-1){ r -= areas[zi]; if(r <= 0) break; zi++; }
      const z  = zones[zi];
      const a  = pick(blades);
      const th = Math.random()*Math.PI*2, rr = Math.sqrt(Math.random());
      const ux = Math.cos(th)*rr, uy = Math.sin(th)*rr;
      const vx = z.x + ux*z.ax;
      const vy = z.y + uy*(uy < 0 ? z.up : z.ay);
      const depth = Math.min(1, Math.max(0, (vy + H*0.14)/(H*1.28)));
      const sc = (0.70 + depth*0.34) * rnd(0.80,1.24);
      if(place(a, vx, vy + rise(a, sc), sc, Math.random(), false, 0.24)) have++;
    }
  }

  plants.sort((p,q)=>p.y-q.y);
  growT = 0;                       // a new field grows in from sizeFrom
  /* The plants these pointed at no longer exist, and the new ones start
     at 1. Breathing picks up again once the grow-in reaches size end. */
  breathing.length = 0; breatheAcc = 0;
  blooms = plants.filter(p => p.a.role !== 'grass' && p.a.role !== 'stem');
}
window.regrow = ()=>seed();

/* ---------- views ------------------------------------------------ */
/* Four pages in one document. Only the active one is in the flow; the
   rest are [hidden], which is what keeps the grass zones honest -- a
   hidden box measures 0x0 and is skipped, so the clearings belong to
   whatever is actually on screen.

   Routing is on the hash so the browser's own back button works and a
   page can be linked to directly. Anything unrecognised (including the
   long-standing #tune) falls through to home. */
const VIEWS = {home:1, listen:1, shows:1, shop:1};
let booted = false;

function viewFromHash(){
  const h = location.hash.replace(/^#\/?/, '');
  return VIEWS[h] ? h : 'home';
}
/* Changing page changes the shape of the clearings, so it has to resow.
   That is not a side effect to be tolerated -- it is the transition: the
   field regrows in from sizeFrom around the new type. */
function showView(name, resow){
  document.querySelectorAll('[data-view]').forEach(el=>{
    el.hidden = el.dataset.view !== name;
  });
  document.getElementById('back').hidden = name === 'home';
  if(resow && booted) regrowNow();
}
addEventListener('hashchange', ()=>showView(viewFromHash(), true));

function resize(){
  const wasDPR = DPR;
  DPR = pickDPR();
  if(DPR !== wasDPR && ASSETS.length) rebakePlants();
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  /* Baked to a bitmap once per resize. Filling a radial gradient
     across the whole canvas every frame is markedly dearer than
     blitting the same pixels back. */
  vig = document.createElement('canvas');
  vig.width = canvas.width; vig.height = canvas.height;
  const vg = vig.getContext('2d');
  const grad = vg.createRadialGradient(
    canvas.width/2, canvas.height/2, Math.min(canvas.width,canvas.height)*0.34,
    canvas.width/2, canvas.height/2, Math.max(canvas.width,canvas.height)*0.82);
  grad.addColorStop(0,'rgba(26,19,11,0)');
  grad.addColorStop(1,'rgba(26,19,11,.24)');
  vg.fillStyle = grad; vg.fillRect(0,0,vig.width,vig.height);
  seed();
}
addEventListener('resize', resize);

/* Three drifting waves, so gusts travel across the field rather than
   every stem wobbling on the same beat. */
function windAt(x,y,t){
  return Math.sin(x*0.0040 + t*0.52)*0.44
       + Math.sin(y*0.0029 - t*0.36 + 1.7)*0.28
       + Math.sin((x+y*0.6)*0.0015 + t*0.19)*0.40;
}

/* ---------- the brush -------------------------------------------- */
const ptr = {x:-9999,y:-9999,px:-9999,py:-9999,vx:0,vy:0,live:false,touched:false};
const ghost = {t:Math.random()*100, on:false};

function move(e){
  const x = e.clientX, y = e.clientY;
  if(!ptr.live){ ptr.px=x; ptr.py=y; ptr.live=true; }
  ptr.x=x; ptr.y=y; ptr.touched=true; ghost.on=false;
  if(hint.dataset.done!=='true') hint.dataset.done='true';
}
addEventListener('pointermove', move, {passive:true});
addEventListener('pointerdown', move, {passive:true});
addEventListener('pointerleave', ()=>{ ptr.live=false; ptr.x=ptr.y=-9999; });

/* No pointer at all (touch device, or nobody home): a phantom gust
   wanders so the page still shows what it does. */
setTimeout(()=>{ if(!ptr.touched){ ghost.on=true; ptr.live=true; hint.dataset.done='true'; } }, 3200);

const FORCE = 0.070;
/* Ceiling on the drawn swing, in radians of bend. 1.5 becomes ~73
   degrees of lean once the 0.85 stem factor is applied. */
const SWING_MAX = 1.5;

/* The field grows in on load and on every regrow. Sprites are baked at
   P.size, so this is a draw-time scale only -- re-baking 26 assets every
   frame for eight seconds would be absurd. */
let growT = 1e9;
function growth(){
  if(P.grow <= 0 || P.size <= 0) return 1;
  const u = Math.min(1, growT/P.grow);
  const e = u*u*(3-2*u);                                   // smoothstep
  return (P.sizeFrom + (P.size - P.sizeFrom)*e) / P.size;
}

/* ---------- loop ------------------------------------------------- */
let last = performance.now(), t = 0;

/* Sow for the densest meadow, then let the machine tell us how much
   of it it can actually hold. Fast hardware draws the lot; slower
   hardware thins out uniformly instead of stuttering. */
let quality = 1, qTarget = 1, acc = 0, ticks = 0;
let warm = 0;
const FADE = 0.10;    // plants near the cut fade rather than vanish

function govern(dt){
  warm += dt;
  /* Ease toward the target instead of stepping to it. A step drops a
     whole band of ranks between one frame and the next, which is what
     made thinning read as chunks of the meadow disappearing. */
  quality += (qTarget - quality) * Math.min(1, dt*0.9);
  if(warm < 2.5) return;                      // ignore load-time hitches
  if(!P.autothin){ qTarget = 1; return; }
  acc += dt; ticks++;
  if(acc < 1.0) return;
  const ms = (acc/ticks)*1000;
  /* Only act on a real problem. The old band (42-66fps) meant a machine
     holding a perfectly good 58fps was still being thinned. */
  if(ms > 30)      qTarget = Math.max(0.40, qTarget * Math.max(0.88, 24/ms));
  else if(ms < 20) qTarget = Math.min(1, qTarget * 1.06);
  acc = 0; ticks = 0;
}
window.density = ()=>({quality:+quality.toFixed(2), sown:plants.length,
                       drawn:plants.filter(p=>p.rank<quality).length});

function frame(now){
  let dt = (now-last)/1000; last = now;
  dt = Math.min(dt, 1/30); t += dt;
  if(!reduced) govern(dt);

  if(ghost.on){
    ghost.t += dt;
    ptr.x = W*(0.5 + 0.40*Math.sin(ghost.t*0.42)*Math.cos(ghost.t*0.17));
    ptr.y = H*(0.5 + 0.36*Math.sin(ghost.t*0.31 + 1.1));
  }
  ptr.vx = ptr.vx*0.78 + (ptr.x-ptr.px)*0.22;
  ptr.vy = ptr.vy*0.78 + (ptr.y-ptr.py)*0.22;
  ptr.px = ptr.x; ptr.py = ptr.y;
  const speed = Math.hypot(ptr.vx, ptr.vy);
  const brushing = ptr.live && speed > 0.05;

  /* P.settle stretches how long a knocked plant keeps moving: it
     softens the spring damping and slows the shiver decay together. */
  const dampK = 1/Math.max(0.2, P.settle);
  const buzzK = Math.pow(0.055, dt*dampK*P.speed);
  const spd2  = P.speed*P.speed;
  const R     = P.radius;
  /* Amount is a gain on the resulting angle, not just a harder shove.
     Driving it through the impulse alone does not work: a plant is only
     inside the brush for a few frames and the spring pulls back the
     whole time, so the response was either dead at the low end or a
     cliff at the top (measured: squared reached 21 degrees at maximum,
     cubed went 3 -> 7 -> 11 -> 52). The spring itself stays exactly as
     it was, clamped at 0.5, which keeps the motion stable; the setting
     then scales what that bend is worth on screen, up to SWING_MAX. */
  const kick = FORCE * P.rustle * P.rustle * 1.5;
  growT += dt;
  const gz = growth();

  if(wandering) stepWander(dt);
  /* Runs when wander is off too, so anything still in flight -- or on
     its way back to 1 after wander stopped -- finishes its easing. */
  if(!reduced && (wandering || breathing.length)) stepBreathe(dt);

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha = 1;
  if(linenPat){ ctx.fillStyle = linenPat; ctx.fillRect(0,0,W,H); }

  for(let i=0;i<plants.length;i++){
    const p = plants[i];
    if(p.rank > quality) continue;
    /* Plants within FADE of the cut are drawn translucent, so when the
       governor moves, the field thins in and out instead of popping. */
    const qa = p.rank > quality - FADE ? (quality - p.rank)/FADE : 1;
    const a = p.a;
    const rad = (a.dh + a.stem)*p.s + 24;
    if(p.x < -rad || p.x > W+rad || p.y < -rad || p.y > H+rad) continue;

    if(!reduced){
      const rest = windAt(p.x, p.y, t + p.phase) * 0.055;
      if(brushing){
        const dx = p.x - ptr.x, dy = (p.y - a.dh*p.s*0.55) - ptr.y;
        const d2 = dx*dx + dy*dy;
        if(d2 < R*R){
          const d = Math.sqrt(d2);
          const fall = 1 - d/R;
          const dirx = d > 0.001 ? dx/d : 0;
          const hit  = fall*fall*Math.min(1, speed/13);
          /* Squared, not linear. A spring this stiff barely moves for a
             linear multiplier -- the impulse has to grow much faster
             than the setting to reach the wide swings the clamp allows. */
          p.bendV += (ptr.vx*0.012 + dirx*0.9) * hit * kick;
          p.buzz = Math.min(1, p.buzz + hit*0.75*P.rustle);   // wool shiver
        }
      }
      /* Frequency goes as sqrt(stiffness), so speed scales stiffness by
         its square. Damping scales linearly with it, which holds the
         damping ratio -- otherwise "faster" would also mean "flatter". */
      const acc = -p.stiff*spd2*(p.bend - rest) - p.damp*P.speed*dampK*p.bendV;
      p.bendV += acc*dt; p.bend += p.bendV*dt;
      p.buzz *= buzzK;
      if(p.bend >  0.5){ p.bend =  0.5; p.bendV *= -0.3; }
      if(p.bend < -0.5){ p.bend = -0.5; p.bendV *= -0.3; }
    }

    const shiver = p.buzz * 0.035 * Math.sin(t*34*P.speed + p.phase*7);
    const swing  = Math.max(-SWING_MAX, Math.min(SWING_MAX, p.bend * P.rustle));
    const ang = p.lean + (swing + shiver) * (a.stem > 0 ? 0.85 : 0.60);
    /* p.g is the breathing scale. Folding it in here is the whole cost
       of the effect -- one multiply, on a transform that was already
       being computed. */
    const ps = p.s*gz*p.g;
    const co = Math.cos(ang)*ps, si = Math.sin(ang)*ps;

    ctx.globalAlpha = p.fade * qa;
    ctx.setTransform(DPR*co*p.flip, DPR*si*p.flip, -DPR*si, DPR*co, DPR*p.x, DPR*p.y);
    ctx.drawImage(a.cv, a.dx, a.dy, a.cw, a.ch);
  }

  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha = 1;
  if(vig) ctx.drawImage(vig, 0, 0);

  requestAnimationFrame(frame);
}

/* ---------- tuning panel ----------------------------------------- */
/* key, label, min, max, step, what changing it costs */
const CONTROLS = [
  /* speed, settle, radius, bgGain and bgTint are still live in P and
     still travel in copy json -- they just have no controls now. Note
     that bgGain sits at 1.22, above the ~1.2 where the output clamp
     starts eating bgHue on pale material; if the ground hue ever seems
     unresponsive, that is why, and it is now only reachable through
     tune({bgGain: 1.0}). */
  {grp:'rustle'},
  {k:'rustle',  l:'amount',   min:0,    max:4,   step:0.05},
  {grp:'wander'},
  {k:'wanderSpeed', l:'speed', min:0.25, max:6, step:0.05},
  {grp:'ground color'},
  {k:'bgHue',   l:'hue',   min:0, max:360, step:1, dp:0, cost:'ground'},
  {k:'bgSat',   l:'sat',   min:0, max:2.5, step:0.02, cost:'ground'},
  {grp:'plant color'},
  {k:'fgHue',   l:'hue',   min:0, max:360, step:1, dp:0, cost:'plants'},
  {k:'fgSat',   l:'sat',   min:0, max:2.5, step:0.02, cost:'plants'},
  {k:'fgGain',  l:'gain',  min:0.2, max:2, step:0.01, cost:'plants'},
  {k:'fgTint',  l:'tint',  type:'color', cost:'plants'},
  /* markSize and markColor still exist in P -- markSize scales the type
     and its clearings, and wander writes the colour it computes back
     into markColor -- they just no longer have controls. */
  {grp:'mix'},
  {k:'mixPurple', l:'purple flwrs', min:0, max:2, step:0.05, cost:'regrow', rg:1},
  {k:'mixWhite',  l:'white flwrs',  min:0, max:2, step:0.05, cost:'regrow', rg:1},
  {k:'mixYellow', l:'yellow flwrs', min:0, max:2, step:0.05, cost:'regrow', rg:1},
  {k:'mixPink',   l:'pink flwrs',   min:0, max:2, step:0.05, cost:'regrow', rg:1},
  {k:'mixGrass',  l:'grass',        min:0, max:2, step:0.05, cost:'regrow', rg:1},
  {grp:'meadow'},
  {k:'ground',  l:'ground zoom', min:0.12, max:1.5, step:0.01, cost:'ground'},
  {k:'density', l:'density',  min:0.2,  max:4,   step:0.05, cost:'regrow', rg:1},
  {grp:'grow in'},
  {k:'sizeFrom',l:'size start',min:0.2, max:2,   step:0.02, rg:1},
  {k:'size',    l:'size end',  min:0.4, max:2.5, step:0.02, cost:'plants'},
  {k:'grow',    l:'seconds',   min:0,   max:30,  step:0.5,  dp:1, rg:1}
  /* autothin has no control any more. It is 0 in DEFAULTS, so the
     governor is off and nothing thins the field -- reach it with
     tune({autothin: 1}) if a slow machine ever needs protecting. */
];
const panel = document.getElementById('tune');
const inputs = {};
let pending = null;

/* Re-baking every sprite on each pixel of slider travel would stutter,
   so the expensive half is coalesced onto the next frame. */
function schedule(kind){
  pending = pending === 'plants' || kind === 'plants' ? 'plants' : kind;
  if(schedule.queued) return;
  schedule.queued = true;
  requestAnimationFrame(()=>{
    schedule.queued = false;
    if(pending === 'plants') rebakePlants();
    if(pending === 'plants' || pending === 'ground') rebakeGround();
    pending = null;
  });
}

/* Density, the mix, the grow-in and the words' clearing only take effect
   when the field is resown, and resowing mid-drag would be both jarring
   and expensive. So they queue one: four quiet seconds after the last
   such change, whichever control it was, the field regrows itself. */
const REGROW_WAIT = 4000;
let regrowTimer = null, noteIdle = 'auto-regrows 4s after a change.';

function setNote(s){ const n = document.getElementById('tuneNote'); if(n) n.textContent = s; }
function cancelRegrow(){
  if(regrowTimer){ clearTimeout(regrowTimer); regrowTimer = null; }
}
function queueRegrow(){
  cancelRegrow();
  setNote('regrowing…');
  regrowTimer = setTimeout(()=>{ regrowTimer = null; seed(); setNote(noteIdle); }, REGROW_WAIT);
}
/* Anything that resows right now makes a pending one redundant. */
function regrowNow(){ cancelRegrow(); seed(); setNote(noteIdle); }

function syncPanel(){
  CONTROLS.forEach(c=>{
    const i = inputs[c.k];
    if(!i) return;
    if(c.type === 'check')      i.el.checked = !!P[c.k];
    else if(c.type === 'color') i.el.value = P[c.k];
    else { i.el.value = P[c.k]; i.out.textContent = (+P[c.k]).toFixed(c.dp ?? 2); }
  });
}

/* Wander travels the full range of the slider it drives. Reading the
   bounds off CONTROLS rather than repeating them means widening a
   slider widens the wander with it. */
function syncWanderBounds(){
  for(const w of WANDER){
    const c = CONTROLS.find(x=>x.k === w.k);
    if(c && typeof c.min === 'number'){ w.lo = c.min; w.hi = c.max; }
  }
}

function buildPanel(){
  syncWanderBounds();
  const body = document.getElementById('tuneBody');
  let group = body;
  CONTROLS.forEach(c=>{
    if(c.grp){
      group = document.createElement('div');
      group.className = 'grp';
      group.innerHTML = '<i>' + c.grp + '</i>';
      body.appendChild(group);
      return;
    }
    const {k, l, min, max, step, type, cost, dp, rg} = c;
    const lab = document.createElement('label');
    lab.innerHTML = '<span class="lab">' + l + '<b></b></span>';
    const el = document.createElement('input');
    const out = lab.querySelector('b');

    if(type === 'check'){
      el.type = 'checkbox'; el.checked = !!P[k];
      lab.querySelector('.lab').prepend(el);
    } else if(type === 'color'){
      el.type = 'color'; el.value = P[k];
      lab.querySelector('.lab').appendChild(el);
      out.remove();
    } else {
      el.type='range'; el.min=min; el.max=max; el.step=step; el.value=P[k];
      out.textContent = (+P[k]).toFixed(dp ?? 2);
      lab.appendChild(el);
    }
    group.appendChild(lab);
    inputs[k] = {el, out};
    /* Push P[k] out to the control and to whatever it drives. Shared so
       an alt-click reset takes exactly the same path as a drag. */
    const apply = ()=>{
      if(type === 'check')      el.checked = !!P[k];
      else if(type === 'color') el.value = P[k];
      else { el.value = P[k]; out.textContent = (+P[k]).toFixed(dp ?? 2); }
      if(cost === 'mark') applyMark();
      if(cost === 'ground' || cost === 'plants') schedule(cost);
      if(rg) queueRegrow();
    };

    el.addEventListener('input', ()=>{
      if(wandering && WANDER.some(w=>w.k===k)) setWander(false);
      P[k] = type === 'check' ? (el.checked ? 1 : 0)
           : type === 'color' ? el.value
           : +el.value;
      apply();
    });

    /* Alt-click restores the default, the way Logic does it. Caught on
       pointerdown because a range jumps its thumb on press, and a colour
       input opens the picker -- both have to be stopped before they act. */
    el.addEventListener('pointerdown', e=>{
      if(!e.altKey) return;
      e.preventDefault(); e.stopPropagation();
      P[k] = DEFAULTS[k];
      apply();
    });
    el.addEventListener('click', e=>{ if(e.altKey){ e.preventDefault(); e.stopPropagation(); } });
  });

  /* Live readout, so the governor thinning the field is visible as a
     number rather than as plants mysteriously going missing. */
  const stat = document.createElement('p');
  stat.className = 'note';
  body.appendChild(stat);
  let sLast = performance.now(), sMs = 16.7;
  (function statTick(){
    const now = performance.now();
    sMs = sMs*0.92 + (now - sLast)*0.08; sLast = now;
    if(!panel.hidden){
      const d = density();
      stat.textContent = Math.round(1000/sMs) + ' fps  ·  ' + d.drawn + '/' + d.sown
                       + ' drawn  ·  quality ' + d.quality.toFixed(2);
    }
    requestAnimationFrame(statTick);
  })();

  document.getElementById('tReset').onclick  = ()=>{
    cancelRegrow();
    Object.assign(P, DEFAULTS); syncPanel(); applyMark(); rebakePlants(); rebakeGround(); seed();
    setNote(noteIdle);
  };
  document.getElementById('tCopy').onclick = async ()=>{
    const txt = JSON.stringify(P, null, 2);
    const note = document.getElementById('tuneNote');
    try { await navigator.clipboard.writeText(txt); note.textContent = 'copied. paste it back to persist.'; }
    catch(e){
      const ta = document.createElement('textarea');
      ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); note.textContent = 'copied. paste it back to persist.'; }
      catch(e2){ note.textContent = 'copy failed -- see console'; console.log(txt); }
      ta.remove();
    }
    setTimeout(()=>{ if(!regrowTimer) note.textContent = noteIdle; }, 4000);
  };

  /* The corner links sit above the panel and never move, so options
     is always there to close it again. */
  const optBtn = document.getElementById('tOptions');
  const show = v=>{ panel.hidden = !v; optBtn.setAttribute('aria-expanded', String(v)); };
  optBtn.onclick = ()=>show(panel.hidden);
  document.getElementById('tWander').onclick = ()=>setWander(!wandering);
  document.getElementById('tRegrow').onclick = ()=>regrowNow();
  addEventListener('keydown', e=>{
    if(e.key === 'c' && !e.metaKey && !e.ctrlKey && !e.altKey) show(panel.hidden);
    if(e.key === 'Escape') show(false);
  });
  /* Hidden by default everywhere. The corner dot, `c`, or #tune opens it. */
  if(location.hash.includes('tune')) show(true);
}

/* Apply a saved set: window.tune({...}) */
window.tune = obj=>{
  if(!obj || typeof obj !== 'object') return {...P};
  /* Colour used to be three channel gains per target. Fold an older
     saved set into the tint + gain the panel uses now, rather than
     dropping it on the floor. */
  const fold = (r,g,b)=>{
    const m = Math.max(r,g,b) || 1;
    const h = v=>Math.round(Math.min(255, v/m*255)).toString(16).padStart(2,'0');
    return ['#' + h(r) + h(g) + h(b), +m.toFixed(2)];
  };
  if(typeof obj.br === 'number') [obj.bgTint, obj.bgGain] = fold(obj.br, obj.bg, obj.bb);
  if(typeof obj.fr === 'number') [obj.fgTint, obj.fgGain] = fold(obj.fr, obj.fg, obj.fb);

  Object.keys(DEFAULTS).forEach(k=>{
    if(typeof obj[k] === typeof DEFAULTS[k]) P[k] = obj[k];
  });
  cancelRegrow();
  syncPanel(); applyMark(); rebakePlants(); rebakeGround(); seed();
  return {...P};
};

boot();
</script>
</body>
</html>
